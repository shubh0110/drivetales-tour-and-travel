<!-- cars-modal-suv.html — SUV / MPV Modal -->
<!-- Cars are injected automatically by suv-data.js. Do NOT add car cards here manually. -->

<div class="fleet-modal" id="suvModal">
    <div class="fleet-modal-box">

        <button class="fleet-close" id="closeSuvModal">
            <ion-icon name="close-outline"></ion-icon>
        </button>

        <div class="fleet-hero">
            <div class="fleet-left">
                <span class="fleet-tag">
                    <ion-icon name="car-sport"></ion-icon>
                    Premium SUV & MPV Collections
                </span>

                <h1>Travel Bold & Spacious</h1>

                <p>Airport Transfers • Family Trips • Corporate Travel • Outstation Tours</p>

                <div class="fleet-stats">
                    <div class="stat">
                        <h3 id="vehicleCount">3+</h3>
                        <span>Vehicles</span>
                    </div>
                    <div class="stat">
                        <h3>24/7</h3>
                        <span>Support</span>
                    </div>
                    <div class="stat">
                        <h3>4.9★</h3><span>Rating</span>
                    </div>
                </div>
            </div>

            <div class="fleet-right">
                <img src="./assets/images/suv/ertiga.png" alt="SUV Fleet">
            </div>
        </div>

        <!-- TAB BAR -->
        <div class="fleet-tabs">
            <button class="fleet-tab active" data-tab="cab">
                <ion-icon name="car-sport-outline"></ion-icon>
                Cab Services
            </button>
            <button class="fleet-tab" data-tab="rent">
                <ion-icon name="key-outline"></ion-icon>
                Rent Car
            </button>
        </div>

        <!-- CAB TAB — cards injected by suv-data.js -->
        <div class="fleet-tab-content active" id="cab">
            <div class="fleet-grid-modal">
                <!-- auto-populated -->
            </div>
        </div>

        <!-- RENT TAB — cards injected by suv-data.js -->
        <div class="fleet-tab-content" id="rent">
            <div class="fleet-grid-modal">
                <!-- auto-populated -->
            </div>
        </div>

    </div>
</div>
